<!DOCTYPE html>
<html lang="es">
    <head>
        <meta charset="utf-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1" />
        <title>Sin conexión — FichaTime</title>
        <style>
            * { box-sizing: border-box; }
            body {
                margin: 0;
                min-height: 100vh;
                display: flex;
                align-items: center;
                justify-content: center;
                background: #f1f5f9;
                color: #0f172a;
                font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
                padding: 1.5rem;
            }
            .card {
                background: #fff;
                border-radius: 1rem;
                box-shadow: 0 10px 30px rgb(15 23 42 / 0.08);
                padding: 2rem;
                max-width: 24rem;
                text-align: center;
            }
            img { width: 72px; height: 72px; border-radius: 1rem; }
            h1 { font-size: 1.25rem; margin: 1rem 0 0.5rem; }
            p { color: #475569; font-size: 0.925rem; line-height: 1.5; margin: 0 0 1.5rem; }
            button {
                background: #4f46e5;
                color: #fff;
                border: 0;
                border-radius: 0.5rem;
                padding: 0.7rem 1.25rem;
                font-size: 0.925rem;
                font-weight: 600;
                cursor: pointer;
            }
            button:hover { background: #4338ca; }
        </style>
    </head>
    <body>
        <div class="card">
            <img src="/icons/icon-192.png" alt="FichaTime" />
            <h1>Sin conexión</h1>
            <p>
                No hemos podido conectar con el servidor. Comprueba tu conexión a internet
                e inténtalo de nuevo.
            </p>
            <button onclick="location.reload()">Reintentar</button>
        </div>
    </body>
</html>
