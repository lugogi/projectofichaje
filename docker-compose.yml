services:
  laravel:
    build:
      context: ..
      dockerfile: Dockerfile
    container_name: fichaje_laravel
    restart: always
    ports:
      - "80:80"
    environment:
      DB_HOST: mysql
      DB_DATABASE: fichaje_smd
      DB_USERNAME: laravel
      DB_PASSWORD: laravel
    volumes:
      - .:/var/www/html
    depends_on:
      - mysql
    networks:
      - fichaje_network

  mysql:
    image: mysql:8.0
    container_name: fichaje_mysql
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: fichaje_smd
      MYSQL_USER: laravel
      MYSQL_PASSWORD: laravel
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    command: --default-authentication-plugin=mysql_native_password
    networks:
      - fichaje_network

  phpmyadmin:
    image: phpmyadmin/phpmyadmin
    container_name: fichaje_phpmyadmin
    restart: always
    ports:
      - "8080:80"
    environment:
      PMA_HOST: mysql
      PMA_USER: root
      PMA_PASSWORD: root
    depends_on:
      - mysql
    networks:
      - fichaje_network

volumes:
  mysql_data:

networks:
  fichaje_network:
    driver: bridge
